name: Research checks
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m compileall -q -x '[/\\](vendor|private|runs|runtime|protected)[/\\]' research erp harnesses hardstudy wholeapp
      - run: python -B -m erp.check_published
      - run: python -B -m research.demo
      - run: python -B -m research.check_paper_evidence
      - run: python -B -m harnesses.verify_ordinary
      - run: python -B -m hardstudy.verify
      - run: python -B -m wholeapp.verify
      - run: python -B -m research.verify_findings
      - run: python -B examples/missing_helper_demo.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npx --yes tsx@4.20.6 --test tests/test_multi_model_budget.ts
